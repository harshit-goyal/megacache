[metadata]
name = megacache
version = 0.3.1
description = A correctness-aware cache that prevents stampedes, stale-data incidents, and origin overload.
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
license_files = LICENSE
author = Megaverse
keywords = cache, singleflight, stale-while-revalidate, in-memory
classifiers =
    Development Status :: 3 - Alpha
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Topic :: Database
    Topic :: Internet :: WWW/HTTP :: HTTP Servers

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
include_package_data = True

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    mc = megacache.cli:main
    megacache = megacache.cli:main
